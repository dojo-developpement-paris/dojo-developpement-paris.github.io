<style>
	* {
		margin: 0;
		padding: 0;
	}

	svg {
		max-width: 100%;
		height: 100%;
		margin: auto;
	}

	html,
	body {
		container-type: size;

		width: 490px;
		aspect-ratio: 16/9;
		overflow: hidden;

		background-color: black;
	}

	/* layout */
	.banner {
		--padding: 5cqh;
		--meetup-height: 25cqh;
		--arrow-height: 9cqh;
		--catchphrase-height: 21cqh;
		--mobilizon-height: 35cqh;

		display: grid;
		grid-template-areas:
			"meetup"
			"arrow"
			"catchphrase"
			"mobilizon"
		;
		grid-template-rows: calc(var(--padding) + var(--meetup-height)) var(--arrow-height) var(--catchphrase-height) calc(var(--mobilizon-height) + var(--padding));
		text-align: center;

		>* {
			padding-inline: var(--padding);
		}

		>*:first-child {
			padding-block-start: var(--padding);
		}

		>*:last-child {
			padding-block-end: var(--padding);
		}

		.meetup {
			grid-area: meetup;

			position: relative;

			.cross {
				position: absolute;
				left: 50%;
				translate: -50%;
				height: var(--meetup-height);
			}
		}

		.arrow {
			grid-area: arrow;
		}

		.catchphrase {
			grid-area: catchphrase;
		}

		.mobilizon {
			grid-area: mobilizon;
		}
	}

	/* font */
	.banner {
		font-family: Helvetica;

		.arrow {
			font-size: 0.8lh;
			line-height: var(--arrow-height);
		}

		.catchphrase {
			font-size: 16cqh;
			line-height: 1;
		}
	}

	/* color */
	.banner {
		--meetup-color: rgb(255, 74, 121);
		--mobilizon-color: #3E3B56;

		color: #FFF;

		.meetup {
			background-color: var(--meetup-color);

			.cross {
				stroke: var(--mobilizon-color);
				stroke-width: 5cqh;
			}
		}

		.arrow {
			background-image: linear-gradient(to bottom, var(--meetup-color), var(--mobilizon-color));
		}

		.catchphrase {
			background-color: var(--mobilizon-color);
		}

		.mobilizon {
			background-color: var(--mobilizon-color);
		}
	}
</style>
